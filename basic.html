<html>      
    <head>
        <title>Basic HTML</title>
        <style>
            
        </style>
    </head>
    <body>
        <form>
        <h1>Welcome to Basic HTML</h1>
        <p>This is a simple HTML page.</p>  
       
        <label>Enter Father's Name:</label>
        <input type="text" name="fname"><br><br>
        <label>Enter Mother's Name:</label>
        <input type="text" name="mname"><br><br>
        <label>Enter Your Age:</label>
        <input type="text" name="age"><br><br>
        <label>Enter Your Number:</label>
        <input type="text" name="number"><br><br>
        <label>Enter Your Email:</label>
        <input type="text" name="email"><br><br>
        <Label>Enter Your Address:</Label>
        <textarea name="address"></textarea><br><br>
        <label>Enter Your Gender:</label>
        <input type="radio" name="gender" value="male"> Male    
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other">Other <br><br>
        <label>Select Your Hobbies:</label>
        <input type="checkbox" name="hobbies" value="reading"> Reading
        <input type="checkbox" name="hobbies" value="writing"> Writing
        <input type="checkbox" name="hobbies" value="coding"> Coding<br><br>
        <label>Select Your Country:</label>
        <select name="country">
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="india">India</option>
        </select><br><br>
        <label>Enter Your State:</label>
        <select name="state">
            <option value="andhra pradesh">Andra Pradesh</option>
            <option value="telangana">Telangana</option>
            <option value="karnataka">Karnataka</option>
            <option value="Paris">Paris</option>
            <option value="London">London</option>
            <option value="Sydney">Sydney</option>
        </select><br><br>
        <label style="color:crimson;
               font-family:'Times New Roman', Times, serif;
               text-align: center;
               font-size: 25px;">
        Enter Your Password:</label>
        <input type="password" name="pwd"><br><br>
        <Label name = "doblabel">Date Of Birth</Label>
        <input type="date" name="dob"><br><br>
        <input type="submit" value="Submit">    
        <input type="reset" value="reset"><br><br>
        
    <table >
        <tr>
            <td>label class ="unamelabel">Name:</label></td>
            <td> input type="text" name="uname"></td>
        </tr>
    </table>
</form>
</body>
</html>
